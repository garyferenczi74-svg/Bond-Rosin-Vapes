<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bond Haus</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; max-width: 100%; }
  body { min-height: 100vh; background: #1B1D1C; color: #E1DAD0; font-family: Aptos, 'Segoe UI Variable', 'Segoe UI', Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  @keyframes breatheScale { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes soft { from { opacity: 0; } to { opacity: 1; } }
  .breathe { transform-origin: center; animation: breatheScale 3.6s ease-in-out infinite; }
  .rise { animation: rise .7s cubic-bezier(0.22,1,0.36,1) both; }
  .soft { animation: soft .5s ease both; }
  @media (prefers-reduced-motion: reduce) { .breathe, .rise, .soft { animation: none; } }
  .field { background: transparent; border: 1px solid #3A3C3B; border-radius: 2px; color: #E1DAD0; font-family: inherit; font-size: 15px; padding: 14px 16px; width: 100%; outline: none; transition: border-color .3s; }
  .field:focus { border-color: #C29A45; }
  .field::placeholder { color: #6E685E; }
  .didot { font-family: 'GFS Didot', Didot, serif; }
  .gold { background: linear-gradient(160deg,#8F6B25 0%,#C29A45 38%,#E3C270 50%,#C29A45 62%,#8F6B25 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .navlink { font-family: 'GFS Didot', Didot, serif; font-size: 12.5px; letter-spacing: 0.18em; text-transform: uppercase; color: #8E887C; padding: 6px 0; border-bottom: 1px solid transparent; transition: color .3s, border-color .3s; cursor: pointer; }
  .navlink:hover { color: #E1DAD0; }
  .navlink.on { color: #E1DAD0; border-bottom-color: #C29A45; }
  .htab { background: transparent; border: 1px solid #3A3C3B; border-radius: 2px; color: #B0A99A; font-family: inherit; font-size: 12px; letter-spacing: 0.06em; padding: 9px 16px; cursor: pointer; transition: border-color .3s, color .3s; }
  .htab:hover { border-color: #C29A45; color: #E1DAD0; }
  .htab.on { border-color: #C29A45; color: #E1DAD0; }
  .htab[disabled] { opacity: 0.4; cursor: not-allowed; }
  .card { background: #1E201E; border: 1px solid #2A2C29; border-radius: 4px; padding: 22px 24px; position: relative; overflow: hidden; }
  .lbl { font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: #6E685E; }
  .hair { height: 1px; background: #2A2C29; border: none; }
  .spine { display: flex; align-items: center; gap: 14px; padding: 15px 18px; background: #191B18; border: 1px solid #2A2C29; border-radius: 3px; cursor: pointer; transition: border-color .3s, transform .3s; }
  .spine:hover { border-color: #4E4A43; transform: translateX(3px); }
  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px); background: #232522; border: 1px solid #4E4A43; color: #E1DAD0; padding: 13px 24px; border-radius: 3px; font-size: 13px; letter-spacing: 0.04em; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; z-index: 200; box-shadow: 0 12px 40px rgba(0,0,0,0.55); max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .scroll::-webkit-scrollbar { width: 8px; } .scroll::-webkit-scrollbar-thumb { background: #2A2C29; border-radius: 4px; }
  @media (max-width: 820px) { .grid3 { grid-template-columns: 1fr !important; } .grid2 { grid-template-columns: 1fr !important; } .nav { gap: 14px !important; } }
</style>
</head>
<body>
<div id="app" style="min-height:100vh;display:flex;flex-direction:column"></div>
<div id="toast" class="toast"></div>

<script>
// Bond Haus, the members floor. In memory member model with a clean seam.
// House voice throughout, second person made personal. This floor holds no
// commerce: nothing is offered, no basket, no acquiring anywhere. No em dashes, no
// en dashes, no exclamation points in copy. Triads are period separated. Everything
// a member records is private, optional, and erasable. Refresh resets by design.

var DEMO_EMAIL = 'member@bond.test';
var GOLD = 'linear-gradient(160deg,#8F6B25 0%,#C29A45 38%,#E3C270 50%,#C29A45 62%,#8F6B25 100%)';
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var COMPS = [
  { id:'no1', name:'No. 1 Dialed', tier:'Everyday', accent:'#B8946A', tint:'rgba(184,148,106,0.05)', triad:['Bright','Clear','Social'], top:['Citrus peel','Green anise'], heart:['Pine','Black pepper'], base:['Cedar','Warm earth'] },
  { id:'no2', name:'No. 2 Unwind', tier:'Evening', accent:'#7E93A8', tint:'rgba(126,147,168,0.05)', triad:['Calm','Round','Quiet'], top:['Lavender','Bergamot'], heart:['Chamomile','Clove'], base:['Sandalwood','Musk'] },
  { id:'no3', name:'No. 3 Peak', tier:'Reserve', accent:'#C08457', tint:'rgba(192,132,87,0.05)', triad:['Deep','Full','Rare'], top:['Ripe mango','Blood orange'], heart:['Gardenia','Fennel'], base:['Amber','Loam'] }
];
var BATCH_RECORDS = {
  'BND-1-0518': { comp:'no1', cultivar:'Sunrise Runtz', harvest:'2026-04-10', pressing:'2026-04-22', batch:'BND-1-0518', run:null },
  'BND-2-0731': { comp:'no2', cultivar:'Evening Papaya', harvest:'2026-05-02', pressing:'2026-05-15', batch:'BND-2-0731', run:null },
  'BND-3-0214': { comp:'no3', cultivar:'Midnight Zkittlez', harvest:'2026-03-18', pressing:'2026-03-30', batch:'BND-3-0214', run:{ number:214, size:1000 } }
};
var GUIDE = [
  { id:'cover', title:'The Experience Guide', kind:'cover' },
  { id:'notes', title:'On Notes', kind:'essay', body:'A note is a memory before it is a smell. The house presses so the plant arrives whole, its top notes lifting first, its heart holding the middle, its base staying after the rest has gone. Read a composition the way you would read a room: what greets you, what stays, what lingers when you have left.' },
  { id:'no1', title:'No. 1 Dialed', kind:'comp', comp:'no1' },
  { id:'no2', title:'No. 2 Unwind', kind:'comp', comp:'no2' },
  { id:'no3', title:'No. 3 Peak', kind:'comp', comp:'no3' },
  { id:'ritual', title:'The Ritual', kind:'ritual' }
];
var INTENTIONS = ['Clarity','Rest','Presence','Creativity','Connection'];
var NAV = [['dashboard','Dashboard'],['salon','Salon'],['library','Library'],['guide','Guide'],['reserve','Reserve'],['events','Events'],['ritual','Ritual'],['account','Account']];

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function comp(id){ return COMPS.filter(function(c){ return c.id===id; })[0]; }
function greeting(){ var h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }

// Shared content published from the Vauxhall Haus wing (localStorage). The member
// floor reads it so a published admin edit reaches the Salon, Library, and Reserve.
// Member-written content (notes, reflections, sessions) is never stored here.
var HAUS_SHARED = null;
try { var _rawShared = localStorage.getItem('bondHausContent'); if (_rawShared) HAUS_SHARED = JSON.parse(_rawShared); } catch(e){}
function sharedBatch(num){ if (!HAUS_SHARED || !HAUS_SHARED.batches) return null; num=String(num).trim().toUpperCase(); return HAUS_SHARED.batches.filter(function(b){ return String(b.batch).toUpperCase()===num; })[0] || null; }
// the Find Your Bond result from the public site, read fresh so a retake updates the recommendation
function findResult(){ try { var r = localStorage.getItem('bondFindResult'); return r ? JSON.parse(r) : null; } catch(e){ return null; } }

// ---- Reserve Room pickup: nearest Bond carrying dispensary ----
// Reads the shared directory the public finder publishes; falls back to a built
// in set so the room works even if the finder has not been opened this session.
function readJSON(k){ try { var r=localStorage.getItem(k); return r?JSON.parse(r):null; } catch(e){ return null; } }
function havMiles(a, b){ var R=3959; function r(d){ return d*Math.PI/180; } var dLat=r(b[0]-a[0]), dLng=r(b[1]-a[1]); var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLng/2)*Math.sin(dLng/2); return 2*R*Math.asin(Math.min(1,Math.sqrt(x))); }
var FALLBACK_CITIES = { 'New York':[40.7128,-74.0060],'Brooklyn':[40.6782,-73.9442],'Queens':[40.7282,-73.7949],'Bronx':[40.8448,-73.8648],'Staten Island':[40.5795,-74.1502],'Yonkers':[40.9312,-73.8988],'White Plains':[41.0340,-73.7629],'Poughkeepsie':[41.7004,-73.9210],'Kingston':[41.9270,-73.9974],'Newburgh':[41.5034,-74.0104],'Hempstead':[40.7062,-73.6187],'Huntington':[40.8681,-73.4257],'Albany':[42.6526,-73.7562],'Troy':[42.7284,-73.6918],'Saratoga Springs':[43.0831,-73.7846],'Syracuse':[43.0481,-76.1474],'Utica':[43.1009,-75.2327],'Ithaca':[42.4440,-76.5019],'Rochester':[43.1566,-77.6088],'Buffalo':[42.8864,-78.8784],'Binghamton':[42.0987,-75.9180],'Watertown':[43.9748,-75.9108],'Plattsburgh':[44.6995,-73.4529] };
var FALLBACK_CARRIERS = [
  { lic:'OCM-AUR-0101', name:'Empire Botanical Co', city:'New York', lat:40.7128, lng:-74.0060, bond:true },
  { lic:'OCM-AUR-0110', name:'Kings County Cannabis', city:'Brooklyn', lat:40.6782, lng:-73.9442, bond:true },
  { lic:'OCM-AUR-0120', name:'Flushing Fields', city:'Queens', lat:40.7282, lng:-73.7949, bond:true },
  { lic:'OCM-AUR-0201', name:'Hudson Green', city:'Yonkers', lat:40.9312, lng:-73.8988, bond:true },
  { lic:'OCM-AUR-0204', name:'Mid Hudson Cannabis', city:'Poughkeepsie', lat:41.7004, lng:-73.9210, bond:true },
  { lic:'OCM-AUR-0205', name:'Rondout Botanicals', city:'Kingston', lat:41.9270, lng:-73.9974, bond:true },
  { lic:'OCM-AUR-0301', name:'South Shore Cannabis', city:'Hempstead', lat:40.7062, lng:-73.6187, bond:true },
  { lic:'OCM-AUR-0401', name:'Capital Cannabis Co', city:'Albany', lat:42.6526, lng:-73.7562, bond:true },
  { lic:'OCM-AUR-0404', name:'Spa City Reserve', city:'Saratoga Springs', lat:43.0831, lng:-73.7846, bond:true },
  { lic:'OCM-AUR-0501', name:'Salt City Cannabis', city:'Syracuse', lat:43.0481, lng:-76.1474, bond:true },
  { lic:'OCM-AUR-0503', name:'Cayuga Botanicals', city:'Ithaca', lat:42.4440, lng:-76.5019, bond:true },
  { lic:'OCM-AUR-0601', name:'Flower City Cannabis', city:'Rochester', lat:43.1566, lng:-77.6088, bond:true },
  { lic:'OCM-AUR-0701', name:'Queen City Cannabis', city:'Buffalo', lat:42.8864, lng:-78.8784, bond:true }
];
function nyCity(name){ var c = readJSON('bondNyCities') || FALLBACK_CITIES; var keys=Object.keys(c); var k = keys.filter(function(x){ return x.toLowerCase()===String(name).toLowerCase(); })[0] || keys.filter(function(x){ return x.toLowerCase().indexOf(String(name).toLowerCase())===0; })[0]; return k ? { key:k, coord:[c[k][0],c[k][1]] } : null; }
function cityKeys(){ var c = readJSON('bondNyCities') || FALLBACK_CITIES; return Object.keys(c).sort(); }
function bondCarriers(){
  var dir = readJSON('bondDispensaryDir'); var carrierLics = readJSON('bondBondCarriers');
  function isCarrier(d){ return carrierLics ? carrierLics.indexOf(d.lic) !== -1 : d.bond; }
  var fromDir = (dir && dir.length) ? dir.filter(function(d){ return isCarrier(d) && d.lat != null && d.lng != null; }) : [];
  if (fromDir.length) return fromDir;
  return FALLBACK_CARRIERS.filter(isCarrier);
}
function nearestCarriers(coord, n){ return bondCarriers().map(function(d){ return { d:d, miles:havMiles(coord,[d.lat,d.lng]) }; }).sort(function(a,b){ return a.miles-b.miles; }).slice(0, n||3); }
// upcoming short runs a member can reserve a place on
var UPCOMING_RESERVE = [
  { id:'run-nf', name:'No. 4 Nightfall', comp:'no3', line:'A single source midnight press, cold cured slow. Two hundred and fifty numbered.', size:250 }
];
var reserveFlow = { runId:null, city:'', lic:null };

var HausStore = {
  member: null,
  seed: function(){
    this.member = {
      signedIn:false, entered:false, first:'Gary', name:'Gary Ferenczi', email:DEMO_EMAIL, circle:true, age21:false,
      shelf: [], claims: [], reserveHolds: [], city: '', guidePlace: 0,
      events: [
        { id:'ev1', name:'An Evening of Three', date:'2026-08-14', city:'Manhattan', line:'The three compositions, poured slowly, in a quiet room.', capacity:'open', rsvp:'none' },
        { id:'ev2', name:'The Listening Room', date:'2026-08-28', city:'Brooklyn', line:'Records, low light, and a single considered pour.', capacity:'open', rsvp:'requested' },
        { id:'ev3', name:'Harvest Supper', date:'2026-06-20', city:'Hudson Valley', line:'A long table at the close of the season.', capacity:'past', rsvp:'none' }
      ],
      sessions: []
    };
    this.reserveRuns = [
      { id:'run-mz', comp:'no3', cultivar:'Midnight Zkittlez', pressing:'2026-03-30', size:1000, status:'current' },
      { id:'run-ag', comp:'no3', cultivar:'Autumn Gelato', pressing:'2025-11-12', size:500, status:'closed' }
    ];
    this.houseWrites = [
      { text:'A Reserve run has been pressed. No. 3 Peak, Midnight Zkittlez.', view:'reserve' },
      { text:'The Experience Guide, chapter On Notes, is open.', view:'guide' }
    ];
    // published admin content overrides the defaults
    if (HAUS_SHARED){
      if (HAUS_SHARED.houseWrites){ var hw = HAUS_SHARED.houseWrites.filter(function(w){ return w.state==='published'; }).sort(function(a,b){ return (a.order||0)-(b.order||0); }); if (hw.length) this.houseWrites = hw.map(function(w){ return { text:w.body, view:(w.link||'salon') }; }); }
      if (HAUS_SHARED.reserveRuns && HAUS_SHARED.reserveRuns.length){ this.reserveRuns = HAUS_SHARED.reserveRuns.map(function(r){ return { id:r.id, comp:r.sku, cultivar:r.cultivar, pressing:r.pressing, size:r.size, status:(r.state==='ended'?'closed':'current') }; }); }
    }
  },
  registerBatch: function(num){
    var key = String(num).trim().toUpperCase();
    var sb = sharedBatch(key);
    if (sb){
      if (sb.state==='retired') return { retired:true };
      if (sb.state !== 'published') return null;
      var found = this.member.shelf.filter(function(b){ return b.batch===sb.batch; })[0]; if (found) return found;
      var entry = { comp:sb.sku, cultivar:sb.cultivar, harvest:sb.harvest, pressing:sb.pressing, batch:sb.batch, run:(sb.run&&sb.run.number?{number:sb.run.number,size:sb.run.size}:null), notes:'', top:sb.top, heart:sb.heart, base:sb.base };
      this.member.shelf.push(entry); return entry;
    }
    var rec = BATCH_RECORDS[key];
    if (!rec) return null;
    var ex = this.member.shelf.filter(function(b){ return b.batch===rec.batch; })[0]; if (ex) return ex;
    var e2 = { comp:rec.comp, cultivar:rec.cultivar, harvest:rec.harvest, pressing:rec.pressing, batch:rec.batch, run:rec.run, notes:'' };
    this.member.shelf.push(e2); return e2;
  },
  claimRun: function(batch){
    var b = this.member.shelf.filter(function(x){ return x.batch===batch; })[0];
    if (!b || !b.run) return false;
    if (this.member.claims.filter(function(c){ return c.batch===batch; }).length) return true;
    this.member.claims.push({ batch:batch, comp:b.comp, cultivar:b.cultivar, number:b.run.number, size:b.run.size });
    return true;
  },
  logSession: function(compId, intention, duration){ this.member.sessions.unshift({ date:new Date().toISOString().slice(0,10), comp:compId, intention:intention, duration:duration, reflection:'' }); return this.member.sessions[0]; },
  eraseNotes: function(){ this.member.shelf.forEach(function(b){ b.notes=''; }); },
  eraseReflections: function(){ this.member.sessions.forEach(function(s){ s.reflection=''; }); },
  eraseHistory: function(){ this.member.sessions = []; },
  reserveHold: function(runId, runName, disp){
    var rec = { id:'RVH-'+(this.member.reserveHolds.length+1), runId:runId, runName:runName, lic:disp.lic, dispName:disp.name, dispCity:disp.city, when:new Date().toISOString().slice(0,10) };
    this.member.reserveHolds.push(rec);
    // notify the house: mirror the reservation to a shared queue the admin can read
    try { var raw=localStorage.getItem('bondReserveRequests'); var q=raw?JSON.parse(raw):[]; q.push({ email:this.member.email, runId:runId, runName:runName, lic:disp.lic, disp:disp.name, city:disp.city, when:rec.when }); localStorage.setItem('bondReserveRequests', JSON.stringify(q)); } catch(e){}
    return rec;
  },
  releaseHold: function(id){ this.member.reserveHolds = this.member.reserveHolds.filter(function(h){ return h.id !== id; }); },
  record: function(){ var m=this.member; return { name:m.name, email:m.email, circleCorrespondence:m.circle, shelf:m.shelf, reserveClaims:m.claims, reserveHolds:m.reserveHolds, ritualHistory:m.sessions, guidePlace:m.guidePlace, events:m.events.map(function(e){ return { name:e.name, rsvp:e.rsvp }; }) }; }
};

// ================= chrome =================
var app = document.getElementById('app');
var toastEl = document.getElementById('toast');
var toastTimer = null;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); if (toastTimer) clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2800); }

function complianceBand(){
  return '<div style="border-top:1px solid #2A2C29;padding:36px clamp(20px,4vw,56px) 40px;text-align:center"><div style="max-width:720px;margin:0 auto">'
    + '<div class="gold" style="font-size:10px;letter-spacing:0.32em;text-transform:uppercase;display:inline-block;margin:0 0 12px">Health and Safety</div>'
    + '<p style="font-size:11.5px;line-height:1.85;color:#8E887C;margin:0 0 8px">For use only by adults 21 years of age and older. Keep out of reach of children and pets. In case of accidental ingestion or overconsumption, contact the Poison Center at 1-800-222-1222 or call 9-1-1. Please consume responsibly.</p>'
    + '<p style="font-size:11.5px;line-height:1.85;color:#8E887C;margin:0 0 8px">Cannabis may cause impairment and may be habit forming.</p>'
    + '<p style="font-size:11px;line-height:1.7;color:#6E685E;margin:0">Licensed by the New York State Office of Cannabis Management. [OCM LICENSE NUMBER]</p></div></div>';
}
function chrome(active, inner){
  var nav = NAV.map(function(n){ return '<a class="navlink'+(active===n[0]?' on':'')+'" href="#/haus/'+n[0]+'">'+esc(n[1])+'</a>'; }).join('');
  var head = '<header style="display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:22px clamp(20px,4vw,56px);border-bottom:1px solid #2A2C29">'
    + '<a href="#/haus/dashboard" class="didot" style="font-size:19px;letter-spacing:0.35em;padding-left:0.35em;color:#E8E1D5">BOND</a>'
    + '<nav class="nav" style="display:flex;gap:22px;flex-wrap:wrap;align-items:center">'+nav+'</nav>'
    + '<div style="display:flex;align-items:center;gap:12px">'
    + '<a href="Home.dc.html" style="font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#8E887C;border:1px solid #3A3C3B;border-radius:2px;padding:7px 12px">Main page</a>'
    + '<a id="signOut" style="font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#8E887C;border:1px solid #3A3C3B;border-radius:2px;padding:7px 12px;cursor:pointer">Sign out</a></div></header>';
  var body = '<main class="scroll rise" style="flex:1;overflow-y:auto"><div style="max-width:940px;margin:0 auto;padding:36px clamp(20px,4vw,56px) 20px">'+inner+'</div></main>';
  app.innerHTML = head + body + complianceBand();
}

// ================= entry and welcome =================
var doorMode = 'in';
function renderDoor(fail){
  clearRitualTimer();
  app.innerHTML = '<div style="position:relative;flex:1;display:flex;flex-direction:column;min-height:100vh">'
    + '<div style="position:absolute;inset:0;background:radial-gradient(900px 600px at 50% 34%, rgba(194,154,69,0.06), transparent 70%);pointer-events:none"></div>'
    + '<header style="position:relative;display:flex;align-items:center;justify-content:space-between;padding:26px clamp(20px,4vw,56px)"><a href="Home.dc.html" class="didot" style="font-size:19px;letter-spacing:0.35em;color:#E8E1D5;padding-left:0.35em">BOND</a><a href="Home.dc.html" class="didot" style="font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#8E887C">Back to site</a></header>'
    + '<main style="position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:24px"><div class="rise" style="text-align:center;max-width:460px;width:100%">'
    + '<div class="didot gold breathe" style="font-weight:400;font-size:clamp(52px,9vw,88px);letter-spacing:0.35em;padding-left:0.35em;line-height:1;filter:drop-shadow(2px 3px 3px rgba(0,0,0,0.7))">BOND</div>'
    + '<p class="didot" style="font-size:clamp(16px,2vw,22px);letter-spacing:0.16em;color:#E1DAD0;margin:22px 0 0">The Haus is for members.</p>'
    + '<div style="width:min(360px,80%);height:1px;background:linear-gradient(90deg,transparent,#C29A45,transparent);margin:34px auto 0"></div>'
    + (doorMode==='up'
      ? ('<form id="signupForm" style="margin:34px 0 0;display:flex;flex-direction:column;gap:14px;text-align:left">'
        + '<input class="field" type="text" name="first" placeholder="First name" autocomplete="given-name">'
        + '<input class="field" type="email" name="email" placeholder="Email" autocomplete="email">'
        + '<input class="field" type="password" name="password" placeholder="Choose a password" autocomplete="new-password">'

function pyramid(c){
  function tier(label, arr){ return '<div style="display:flex;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid #2A2C29"><span class="lbl" style="min-width:78px">'+label+'</span><span style="font-size:13px;color:#B0A99A">'+arr.join(' . ')+'</span></div>'; }
  return '<div style="margin-top:14px">'+tier('Top notes', c.top)+tier('Heart', c.heart)+tier('Base', c.base)+'</div>';
}
function batchPyramid(b, c){
  var sb = sharedBatch(b.batch);
  function toArr(v){ return v==null||v===''?null:(Array.isArray(v)?v:String(v).split(',').map(function(s){ return s.trim(); }).filter(Boolean)); }
  var top = toArr(sb?sb.top:null) || toArr(b.top) || c.top;
  var heart = toArr(sb?sb.heart:null) || toArr(b.heart) || c.heart;
  var base = toArr(sb?sb.base:null) || toArr(b.base) || c.base;
  function tier(label, arr){ return '<div style="display:flex;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid #2A2C29"><span class="lbl" style="min-width:78px">'+label+'</span><span style="font-size:13px;color:#B0A99A">'+esc(arr.join(' . '))+'</span></div>'; }
  return '<div style="margin-top:14px">'+tier('Top notes', top)+tier('Heart', heart)+tier('Base', base)+'</div>';
}
function batchEntry(b){
  var c = comp(b.comp);
  return '<div class="card soft" style="margin-top:16px"><div style="position:absolute;inset:0;background:'+c.tint+';pointer-events:none"></div><div style="position:relative">'
    + '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:baseline"><div class="didot" style="font-size:24px;color:#E1DAD0">'+esc(b.cultivar)+'</div><span style="font-size:12px;color:'+c.accent+'" class="didot">'+esc(c.name)+'</span></div>'
    + '<div style="display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:#8E887C"><span>Harvest '+esc(b.harvest)+'</span><span>Pressed '+esc(b.pressing)+'</span><span style="font-family:ui-monospace,Menlo,monospace">'+esc(b.batch)+'</span><a style="color:#B0A99A;border-bottom:1px solid #3A3C3B">Certificate of analysis</a></div>'
    + batchPyramid(b, c)
    + (b.run?'<a href="#/haus/reserve" style="display:inline-block;margin-top:14px;font-size:12.5px;color:#E1DAD0;border-bottom:1px solid '+c.accent+';padding-bottom:2px">Claim your Reserve number in the Reserve Room</a>':'')
    + '<div style="margin-top:20px"><div class="lbl">Your notes. Private, optional, and yours to erase.</div>'
    + '<textarea id="noteIn" class="field" data-batch="'+esc(b.batch)+'" rows="3" style="margin-top:10px;resize:vertical" placeholder="What did it bring to mind">'+esc(b.notes)+'</textarea>'
    + '<div style="display:flex;gap:10px;margin-top:10px"><button class="htab" data-savenote="'+esc(b.batch)+'">Save note</button>'+(b.notes?'<button class="htab" data-erasenote="'+esc(b.batch)+'">Erase note</button>':'')+'</div></div>'
    + '</div></div>';

function fmt(sec){ var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function ringSvg(c){

  return '<svg width="220" height="220" viewBox="0 0 220 220" style="display:block;margin:0 auto"><circle cx="110" cy="110" r="'+R+'" fill="none" stroke="#2A2C29" stroke-width="1.5"/>'
    + '<circle id="ritualArc" cx="110" cy="110" r="'+R+'" fill="none" stroke="'+c.accent+'" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="'+C2.toFixed(1)+'" stroke-dashoffset="0" transform="rotate(-90 110 110)"/>'
    + ticks
    + '<text id="ritualClock" x="110" y="110" text-anchor="middle" dominant-baseline="central" font-family="GFS Didot, Didot, serif" font-size="42" fill="#E1DAD0">'+fmt(ritual.remaining)+'</text></svg>';
}
function updateRing(){

  var R=92, C2=2*Math.PI*R;

function startElevate(){
  clearRitualTimer();
  ritualTimer = setInterval(function(){ ritual.remaining--; if (ritual.remaining<=0){ completeRitual(); } else { updateRing(); } }, 1000);
}
function completeRitual(){
  clearRitualTimer();
  var elapsed = Math.round((ritual.total - Math.max(0,ritual.remaining))/60) || ritual.duration;
  HausStore.logSession(ritual.comp, ritual.freeText||ritual.intention, ritual.duration);
  ritual.phase='reflect'; renderRitual();
}

// ================= 7. Account =================
var eraseArm = null;
function renderAccount(){
  var m = HausStore.member;
  var eraseRow = function(key, label){ var armed = eraseArm===key; return '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #2A2C29"><span style="font-size:13.5px;color:#B0A99A">'+esc(label)+'</span>'+(armed?'<span><button class="htab" data-eraseconfirm="'+key+'" style="border-color:#C08457;color:#C08457">Confirm</button> <button class="htab" data-erasecancel="1">Keep</button></span>':'<button class="htab" data-erasearm="'+key+'">Erase</button>')+'</div>'; };
  var inner = '<div class="didot" style="font-size:clamp(24px,3.5vw,34px);color:#E1DAD0">Account</div><p style="font-size:13.5px;color:#8E887C;margin:8px 0 24px">Plain and complete. Everything the house holds, in your hands.</p>'
    + '<div class="card"><div class="lbl">Member</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px">'
    + '<div><div style="font-size:11px;color:#6E685E">Name</div><div style="color:#E1DAD0;margin-top:4px">'+esc(m.name)+'</div></div>'
    + '<div><div style="font-size:11px;color:#6E685E">Email</div><div style="color:#E1DAD0;margin-top:4px">'+esc(m.email)+'</div></div></div>'
    + '<div style="margin-top:18px"><label style="display:flex;gap:10px;align-items:center;font-size:13.5px;color:#B0A99A;cursor:pointer"><input type="checkbox" id="prefCircle"'+(m.circle?' checked':'')+'> Circle correspondence</label></div></div>'
    + '<div class="card" style="margin-top:16px"><div class="lbl">Your data</div><p style="font-size:13px;color:#8E887C;margin:12px 0 14px;line-height:1.7">Everything here is private, optional, and yours to erase, exactly as the Privacy Policy promises.</p>'
    + '<button id="dlRecord" class="htab on" style="padding:0 22px;height:40px">Download my record</button>'
    + '<div style="margin-top:18px">'+eraseRow('notes','Tasting notes')+eraseRow('reflections','Ritual reflections')+eraseRow('history','Ritual history')+eraseRow('account','The whole account')+'</div></div>';
  chrome('account', inner);
}

// ================= router =================
function route(){
  clearRitualTimer();
  var m = HausStore.member;
  var h = location.hash || '#/haus';
  var parts = h.replace(/^#\//,'').split('/');
  var wing = parts[0]; var view = parts[1] || '';
  if (wing !== 'haus'){ location.hash = '#/haus'; return; }
  if (!m.signedIn){ renderDoor(false); return; }
  if (!m.entered || view==='welcome'){ renderWelcome(); return; }
  switch(view){
    case 'dashboard': renderDashboard(); break;
    case 'library': libSel=null; renderLibrary(); break;
    case 'guide': renderGuide(); break;
    case 'reserve': renderReserve(); break;
    case 'events': renderEvents(); break;
    case 'ritual': ritual.phase='setup'; renderRitual(); break;
    case 'account': eraseArm=null; renderAccount(); break;
    case 'salon': renderSalon(); break;
    default: location.hash = '#/haus/dashboard';
  }
}

// ================= events =================
document.addEventListener('click', function(ev){
  var t = ev.target;
  if (t.id==='signOut'){ HausStore.member.signedIn=false; location.hash='#/haus'; route(); return; }

  // salon shelf spine to library
  var sp = t.closest('[data-shelf]'); if (sp){ libSel = sp.getAttribute('data-shelf'); location.hash='#/haus/library'; route(); libSel = sp.getAttribute('data-shelf'); renderLibrary(); return; }

  // library
  if (t.id==='batchAdd'){ var v=(document.getElementById('batchIn')||{}).value||''; var e=HausStore.registerBatch(v); var note=document.getElementById('batchNote'); if (e && e.batch){ libSel=e.batch; toast('Shelved. '+e.cultivar+' is on your shelf.'); renderLibrary(); } else if (e && e.retired){ if (note) note.textContent='That batch is no longer in the house records.'; } else if (note){ note.textContent='That batch is not in the house records. Check the card and try again.'; } return; }
  var lib = t.closest('[data-lib]'); if (lib){ libSel = lib.getAttribute('data-lib'); renderLibrary(); return; }
  var sn = t.closest('[data-savenote]'); if (sn){ var b=HausStore.member.shelf.filter(function(x){return x.batch===sn.getAttribute('data-savenote');})[0]; var ta=document.getElementById('noteIn'); if (b&&ta){ b.notes=ta.value; toast('Your note is kept privately.'); renderLibrary(); } return; }
  var en = t.closest('[data-erasenote]'); if (en){ var b2=HausStore.member.shelf.filter(function(x){return x.batch===en.getAttribute('data-erasenote');})[0]; if (b2){ b2.notes=''; toast('Erased. The house keeps no copy.'); renderLibrary(); } return; }

  // guide
  if (t.id==='gPrev'){ if (HausStore.member.guidePlace>0){ HausStore.member.guidePlace--; renderGuide(); } return; }
  if (t.id==='gNext'){ if (HausStore.member.guidePlace<GUIDE.length-1){ HausStore.member.guidePlace++; renderGuide(); } return; }

  // reserve
  var cl = t.closest('[data-claim]'); if (cl){ if (HausStore.claimRun(cl.getAttribute('data-claim'))){ toast('Your run number is yours.'); renderReserve(); } return; }
  // reserve the next short run, held at the nearest Bond dispensary
  var rrun = t.closest('[data-reserverun]'); if (rrun){ reserveFlow = { runId:rrun.getAttribute('data-reserverun'), city:HausStore.member.city||'', lic:null }; renderReserve(); return; }
  var fp = t.closest('[data-findpickup]'); if (fp){ var v=(document.getElementById('rvCity')||{}).value||''; var nc=nyCity(v); if (!nc){ toast('We could not find that New York city or town.'); return; } reserveFlow.city=nc.key; HausStore.member.city=nc.key; var near=nearestCarriers(nc.coord,3); reserveFlow.lic = near.length ? near[0].d.lic : null; renderReserve(); return; }
  var pc = t.closest('[data-pickcarrier]'); if (pc){ reserveFlow.lic = pc.getAttribute('data-pickcarrier'); renderReserve(); return; }
  var hp = t.closest('[data-holdplace]'); if (hp){ var run=UPCOMING_RESERVE.filter(function(r){ return r.id===hp.getAttribute('data-holdplace'); })[0]; var disp = reserveFlow.lic ? bondCarriers().filter(function(d){ return d.lic===reserveFlow.lic; })[0] : { lic:'', name:'', city:reserveFlow.city }; HausStore.reserveHold(run.id, run.name, disp); reserveFlow={ runId:null, city:'', lic:null }; toast('Your place is held. The house will notify you.'); renderReserve(); return; }
  if (t.closest('[data-reservecancel]')){ reserveFlow={ runId:null, city:'', lic:null }; renderReserve(); return; }
  var rh = t.closest('[data-releasehold]'); if (rh){ HausStore.releaseHold(rh.getAttribute('data-releasehold')); toast('Your place is released.'); renderReserve(); return; }

  // events
  var rs = t.closest('[data-rsvp]'); if (rs){ var e2=HausStore.member.events.filter(function(x){return x.id===rs.getAttribute('data-rsvp');})[0]; if (e2){ e2.rsvp = e2.rsvp==='none'?'requested':e2.rsvp==='requested'?'confirmed':'requested'; toast(e2.rsvp==='requested'?'Your request is with the house.':'Your place is confirmed.'); renderEvents(); } return; }

  // ritual
  var rc = t.closest('[data-rcomp]'); if (rc){ ritual.comp=rc.getAttribute('data-rcomp'); renderRitual(); return; }
  var ri = t.closest('[data-rintent]'); if (ri){ ritual.intention=ri.getAttribute('data-rintent'); ritual.freeText=''; renderRitual(); return; }
  var rd = t.closest('[data-rdur]'); if (rd){ ritual.duration=+rd.getAttribute('data-rdur'); renderRitual(); return; }
  if (t.id==='rBegin'){ var f=document.getElementById('rFree'); if (f&&f.value.trim()) ritual.freeText=f.value.trim(); beginRitual(); return; }
  if (t.id==='rNext'){ advanceRitual(); return; }
  if (t.id==='rEnd'){ completeRitual(); return; }
  if (t.id==='rSaveReflect'){ var rt=document.getElementById('rReflect'); if (HausStore.member.sessions[0]) HausStore.member.sessions[0].reflection=(rt?rt.value:''); toast('Kept privately.'); ritual.phase='setup'; renderRitual(); return; }
  if (t.id==='rSkip'){ ritual.phase='setup'; renderRitual(); return; }

  // account
  if (t.id==='dlRecord'){ downloadRecord(); return; }
  var ea = t.closest('[data-erasearm]'); if (ea){ eraseArm=ea.getAttribute('data-erasearm'); renderAccount(); return; }
  if (t.closest('[data-erasecancel]')){ eraseArm=null; renderAccount(); return; }
  var ec = t.closest('[data-eraseconfirm]'); if (ec){ doErase(ec.getAttribute('data-eraseconfirm')); return; }
});
document.addEventListener('input', function(ev){
  if (ev.target.id==='rFree' && ev.target.value.trim()){ ritual.freeText=ev.target.value; }
});
document.addEventListener('change', function(ev){
  if (ev.target.id==='prefCircle'){ HausStore.member.circle=ev.target.checked; toast(ev.target.checked?'Circle correspondence on.':'Circle correspondence off.'); }
});

function downloadRecord(){
  var blob = new Blob([JSON.stringify(HausStore.record(),null,2)], { type:'application/json' });
  var url = URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download='bond-haus-record.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('Your record is downloading.');
}
function doErase(key){
  eraseArm=null;
  if (key==='notes'){ HausStore.eraseNotes(); }
  else if (key==='reflections'){ HausStore.eraseReflections(); }
  else if (key==='history'){ HausStore.eraseHistory(); }
  else if (key==='account'){ HausStore.seed(); location.hash='#/haus'; toast('Erased. The house keeps no copy.'); route(); return; }
  toast('Erased. The house keeps no copy.');
  renderAccount();
}

window.addEventListener('hashchange', route);
HausStore.seed();
if (!location.hash) location.hash = '#/haus';
route();
</script>
