<script>
// Vauxhall Product wing, Metrc connected. In memory mock data with a clean seam.
// All track and trace goes through TraceProvider; MetrcMockAdapter simulates
// Metrc Connect for New York seed to sale. The MetrcConnectAdapter swaps in for
// production behind the same interface; the store and screens never change.
// Metrc is source of truth for regulatory reality (quantities, UIDs, test status);
// the ERP is source of truth for commercial reality (price, terms, promises).
// No em dashes or en dashes anywhere. Refresh resets the ledger by design.

var TODAY = '2026-07-26';
var STAGES = ['draft','confirmed','fulfillment','shipped','delivered','paid'];
var STAGE_LABEL = { draft:'Draft', confirmed:'Confirmed', fulfillment:'In Fulfillment', shipped:'Shipped', delivered:'Delivered', paid:'Paid', cancelled:'Cancelled' };
var STAGE_COLOR = { draft:'#8E887C', confirmed:'#E3C270', fulfillment:'#86ACE3', shipped:'#7CBF4E', delivered:'#7CBF4E', paid:'#7FA87A', cancelled:'#C08457' };
var RESERVING = ['confirmed','fulfillment'];
var RUN_STAGES = ['fresh frozen','washed','pressed','filled','packaged','ready'];
var TEST_COLOR = { TestPassed:'#7CBF4E', RetestPassed:'#7CBF4E', TestingRequired:'#E3C270', TestFailed:'#D4664C' };
var PASSING = ['TestPassed','RetestPassed'];
var LOW_STOCK = 300;
var DISCREPANCY_TOL = 0.02;

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function money(n){ n = Math.round(n); return '$' + n.toLocaleString(); }
function moneyK(n){ return '$' + (n/1000).toFixed(1) + 'k'; }
function dlt(a, b){ return a < b; }
function clock(){ var d = new Date(); function p(n){ return (n<10?'0':'')+n; } return p(d.getHours())+':'+p(d.getMinutes()); }
function daysUntil(dateStr){ return Math.round((new Date(dateStr).getTime() - new Date(TODAY).getTime())/86400000); }

// ============ TraceProvider seam ============
// The production MetrcConnectAdapter would implement this same interface against
// the real Metrc NY API with a vendor key plus a per licensee user key, license
// scoped calls, 15 minute scheduled pulls, and explicit confirmed writes only.
function MetrcMockAdapter(){
  this.name = 'Metrc Connect (mock)';
  this.packages = {};   // uid -> { uid, item, metrcQty, testStatus, packageDate, facility }
  this.facilities = {}; // license -> { license, name, city, status, licenseExpiry }
  this.transfers = [];  // { manifest, destination, packages, status }
  this.items = [];
  this.tags = { packageRemaining: 380, packageThreshold: 500, retailRemaining: 8600, retailThreshold: 2000, unitCost: 0.10 };
  this.sync = { asOf:'11:05', packages:'11:05', transfers:'11:04', labResults:'09:40', tags:'11:02', next:'11:20', stale:true };
  this._mfx = 40;
}
MetrcMockAdapter.prototype.seedPackage = function(p){ this.packages[p.uid] = p; };
MetrcMockAdapter.prototype.seedFacility = function(f){ this.facilities[f.license] = f; };
MetrcMockAdapter.prototype.seedTransfer = function(t){ this.transfers.push(t); };
MetrcMockAdapter.prototype.getPackages = function(){ var self=this; return Object.keys(this.packages).map(function(k){ return self.packages[k]; }); };
MetrcMockAdapter.prototype.getPackage = function(uid){ return this.packages[uid] || null; };
MetrcMockAdapter.prototype.getLabResults = function(uid){ var p = this.packages[uid]; return p ? { uid:uid, status:p.testStatus, panel:'Potency, pesticides, residual solvents, microbials' } : null; };
MetrcMockAdapter.prototype.getTransfers = function(){ return this.transfers.slice(); };
MetrcMockAdapter.prototype.getFacilities = function(){ var self=this; return Object.keys(this.facilities).map(function(k){ return self.facilities[k]; }); };
MetrcMockAdapter.prototype.getFacility = function(license){ return this.facilities[license] || null; };
MetrcMockAdapter.prototype.getItems = function(){ return this.items.slice(); };
MetrcMockAdapter.prototype.getTagInventory = function(){ return this.tags; };
MetrcMockAdapter.prototype.getSyncStatus = function(){ return this.sync; };
MetrcMockAdapter.prototype.refresh = function(){ var t = clock(); this.sync = { asOf:t, packages:t, transfers:t, labResults:t, tags:t, next:this._plus15(t), stale:false }; return this.sync; };
MetrcMockAdapter.prototype._plus15 = function(t){ var p=t.split(':'); var m=(+p[0])*60+(+p[1])+15; var h=Math.floor(m/60)%24, mm=m%60; return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm; };
MetrcMockAdapter.prototype.createTransferDraft = function(order, destinationLicense){
  var manifest = '00000' + (++this._mfx) + '-NY';
  this.transfers.unshift({ manifest:manifest, destination:destinationLicense, packages: order.lines.length, status:'draft', created:clock() });
  return { manifest:manifest };
};
MetrcMockAdapter.prototype.flipLabResult = function(uid){ var p = this.packages[uid]; if (p && p.testStatus==='TestingRequired'){ p.testStatus = 'TestPassed'; return true; } return false; };

var Trace = new MetrcMockAdapter();

// ============ ProductStore ============
var ProductStore = {
  skus: [], lots: [], accounts: [], orders: [], runs: [], salesHistory: [], plan: 110000,
  feed: [], findings: [],
  _oid: 6000, _lid: 400, _aid: 20, _rid: 400, _sid: 500, _uid: 10,

  seed: function(){
    var self = this;
    this.skus = [
      { id:'no1', name:'No. 1 Dialed', tier:'Everyday', price:24, cogs:9.4, status:'active', metrcItem:'Bond No. 1 Dialed 0.5g AIO', tokens:['Solventless','Everyday','Sativa lean'], triad:['Bright','Clear','Social'], lifecycle:'Active' },
      { id:'no2', name:'No. 2 Unwind', tier:'Evening', price:24, cogs:9.8, status:'active', metrcItem:'Bond No. 2 Unwind 0.5g AIO', tokens:['Solventless','Evening','Indica lean'], triad:['Calm','Round','Quiet'], lifecycle:'Active' },
      { id:'no3', name:'No. 3 Peak', tier:'Reserve', price:32, cogs:12.6, status:'active', metrcItem:'Bond No. 3 Peak Reserve 0.5g AIO', tokens:['Solventless','Reserve','Single source'], triad:['Deep','Full','Rare'], lifecycle:'Reserve' }
    ];
    Trace.items = this.skus.map(function(s){ return { name:s.metrcItem, sku:s.id }; });

    // lots with Metrc packages; L3 carries a seeded discrepancy, L6 is TestingRequired
    this.seedLot('no1', 700, 'TestPassed', '2026-06-14', 'Vault A', 700);
    this.seedLot('no1', 580, 'TestPassed', '2026-07-02', 'Vault A', 580);
    this.seedLot('no2', 600, 'TestPassed', '2026-06-20', 'Vault A', 640);   // discrepancy: Metrc 640 vs ERP 600
    this.seedLot('no2', 460, 'TestPassed', '2026-07-05', 'Vault B', 460);
    this.seedLot('no3', 500, 'TestPassed', '2026-06-28', 'Vault B', 500);
    this.seedLot('no3', 300, 'TestingRequired', '2026-07-18', 'Quarantine', 300); // test gate demo

    // facilities and accounts (Metrc facility status + license expiry)
    var fac = [
      { id:'ac1', name:'Verdant', city:'Albany', license:'OCM-RETAIL-0192', expiry:'2027-03-01', mfac:'active', terms:'Net 30', credit:20000, balance:6240, velocity:310, status:'active' },
      { id:'ac2', name:'Highline', city:'Brooklyn', license:'OCM-RETAIL-0074', expiry:'2027-01-15', mfac:'active', terms:'Net 30', credit:30000, balance:8640, velocity:380, status:'active' },
      { id:'ac3', name:'Northstar', city:'Buffalo', license:'OCM-RETAIL-0231', expiry:'2026-12-20', mfac:'active', terms:'Net 15', credit:15000, balance:4320, velocity:190, status:'active' },
      { id:'ac4', name:'Solace', city:'Ithaca', license:'OCM-RETAIL-0308', expiry:'2027-05-01', mfac:'active', terms:'COD', credit:8000, balance:0, velocity:120, status:'active' },
      { id:'ac5', name:'Meridian', city:'Rochester', license:'OCM-RETAIL-0141', expiry:'2026-09-08', mfac:'active', terms:'Net 30', credit:18000, balance:9200, velocity:260, status:'active' },
      { id:'ac6', name:'Halcyon', city:'Kingston', license:'OCM-RETAIL-0355', expiry:'2027-06-01', mfac:'inactive', terms:'COD', credit:6000, balance:0, velocity:0, status:'prospect' }
    ];
    this.accounts = fac.map(function(a){ return { id:a.id, name:a.name, city:a.city, license:a.license, licenseExpiry:a.expiry, terms:a.terms, credit:a.credit, balance:a.balance, velocity:a.velocity, status:a.status }; });
    fac.forEach(function(a){ Trace.seedFacility({ license:a.license, name:a.name, city:a.city, status:a.mfac, licenseExpiry:a.expiry }); });

    // orders; open ones carry lot allocations
    this.orders = [];
    this.seedOrder('ac1', [{skuId:'no1',qty:240},{skuId:'no3',qty:120}], '2026-07-24', 'fulfillment', '0000012-NY');
    this.seedOrder('ac2', [{skuId:'no2',qty:360}], '2026-07-29', 'fulfillment', '0000013-NY');
    this.seedOrder('ac3', [{skuId:'no1',qty:180}], '2026-08-02', 'confirmed', '');
    this.seedOrder('ac4', [{skuId:'no3',qty:96}], '2026-08-05', 'confirmed', '');
    this.seedOrder('ac5', [{skuId:'no2',qty:240},{skuId:'no1',qty:120}], '2026-08-09', 'draft', '');
    // settled history for sales and board
    this.pushOrder('ac2', [{skuId:'no1',qty:300}], '2026-07-22', 'delivered', '0000009-NY', '2026-07-22');
    this.pushOrder('ac1', [{skuId:'no2',qty:260}], '2026-07-24', 'delivered', '0000010-NY', '2026-07-24');
    this.pushOrder('ac5', [{skuId:'no3',qty:180}], '2026-06-28', 'paid', '0000006-NY', '2026-06-28');
    this.pushOrder('ac3', [{skuId:'no1',qty:220}], '2026-07-11', 'paid', '0000007-NY', '2026-07-11');

    this.runs = [
      { id:'RUN-401', skuId:'no1', qty:900, stage:'pressed', ready:'2026-07-31', started:'2026-07-16', yield:'62 percent' },
      { id:'RUN-402', skuId:'no2', qty:700, stage:'filled', ready:'2026-08-05', started:'2026-07-19', yield:'59 percent' }
    ];
    this.salesHistory = [ { month:'Mar', revenue:58200 }, { month:'Apr', revenue:66400 }, { month:'May', revenue:71900 }, { month:'Jun', revenue:79600 } ];

    Trace.seedTransfer({ manifest:'0000012-NY', destination:'OCM-RETAIL-0192', packages:2, status:'accepted', created:'07-22' });
    Trace.seedTransfer({ manifest:'0000013-NY', destination:'OCM-RETAIL-0074', packages:1, status:'in transit', created:'07-24' });

    // detect seeded discrepancies and auto raise investigations
    this.scanDiscrepancies();
  },

  seedLot: function(skuId, qty, testStatus, packageDate, location, metrcQty){
    var uid = this.mkUid();
    this.lots.push({ id:'LOT-'+(++this._lid), uid:uid, skuId:skuId, qty:qty, reserved:0, packageDate:packageDate, location:location, coa:'COA-'+uid.slice(-4) });
    Trace.seedPackage({ uid:uid, item:this.sku(skuId).metrcItem, metrcQty:(metrcQty==null?qty:metrcQty), testStatus:testStatus, packageDate:packageDate, facility:'OCM-PROC-0001' });
    return uid;
  },
  mkUid: function(){ return '1A4FF0100000022' + String(1000000 + (++this._uid)); },

  pushOrder: function(accountId, lines, promised, stage, manifest, shippedAt){
    var o = { id:'SO-'+(++this._oid), accountId:accountId, lines:lines.map(function(l){ return { skuId:l.skuId, qty:l.qty, allocations:[] }; }), promised:promised, stage:stage, createdAt:TODAY, shippedAt:shippedAt||'', manifest:manifest||'', total:this.orderTotal(lines) };
    this.orders.push(o); return o;
  },
  seedOrder: function(accountId, lines, promised, stage, manifest){
    var o = this.pushOrder(accountId, lines, promised, stage, manifest, '');
    if (RESERVING.indexOf(stage)!==-1){ this.allocate(o); }
    return o;
  },
  orderTotal: function(lines){ var self=this; return lines.reduce(function(a,l){ var s=self.sku(l.skuId); return a + (s?s.price:0)*l.qty; },0); },
  orderUnits: function(o){ return o.lines.reduce(function(a,l){ return a+l.qty; },0); },

  // allocation reserves from passing lots, FIFO; returns { ok, short:[names] }
  allocate: function(o){
    var self = this, short = [];
    o.lines.forEach(function(l){
      if (l.allocations.length) return;
      var need = l.qty;
      var lots = self.lots.filter(function(x){ return x.skuId===l.skuId && self.isPassing(x) && self.availLot(x)>0; }).sort(function(a,b){ return a.packageDate<b.packageDate?-1:1; });
      for (var i=0;i<lots.length && need>0;i++){ var take = Math.min(self.availLot(lots[i]), need); lots[i].reserved += take; l.allocations.push({ uid:lots[i].uid, qty:take }); need -= take; }
      if (need>0) short.push(self.sku(l.skuId).name);
    });
    return { ok: short.length===0, short: short };
  },
  releaseAllocations: function(o){ var self=this; o.lines.forEach(function(l){ l.allocations.forEach(function(a){ var lot=self.lotByUid(a.uid); if (lot) lot.reserved = Math.max(0, lot.reserved - a.qty); }); l.allocations = []; }); },

  // ---- lookups and derived ----
  sku: function(id){ return this.skus.filter(function(s){ return s.id===id; })[0]; },
  account: function(id){ return this.accounts.filter(function(a){ return a.id===id; })[0]; },
  order: function(id){ return this.orders.filter(function(o){ return o.id===id; })[0]; },
  lotByUid: function(uid){ return this.lots.filter(function(l){ return l.uid===uid; })[0]; },
  status: function(lot){ var p = Trace.getPackage(lot.uid); return p ? p.testStatus : 'Unknown'; },
  isPassing: function(lot){ return PASSING.indexOf(this.status(lot))!==-1; },
  availLot: function(lot){ return lot.qty - lot.reserved; },
  onHand: function(skuId){ return this.lots.filter(function(l){ return l.skuId===skuId; }).reduce(function(a,l){ return a+l.qty; },0); },
  reserved: function(skuId){ return this.lots.filter(function(l){ return l.skuId===skuId; }).reduce(function(a,l){ return a+l.reserved; },0); },
  available: function(skuId){ return this.onHand(skuId) - this.reserved(skuId); },
  allocatable: function(skuId){ var self=this; return this.lots.filter(function(l){ return l.skuId===skuId && self.isPassing(l); }).reduce(function(a,l){ return a+self.availLot(l); },0); },
  unitsInProcess: function(){ return this.runs.reduce(function(a,r){ return a+r.qty; },0); },
  isLate: function(o){ return RESERVING.indexOf(o.stage)!==-1 && dlt(o.promised, TODAY); },
  openOrders: function(){ return this.orders.filter(function(o){ return ['draft','confirmed','fulfillment','shipped'].indexOf(o.stage)!==-1; }); },

  // ---- gates ----
  accountGate: function(accountId){
    var a = this.account(accountId); if (!a) return { ok:false, reason:'Account not found' };
    if (dlt(a.licenseExpiry, TODAY)) return { ok:false, reason:'License expired ('+a.licenseExpiry+')' };
    var f = Trace.getFacility(a.license);
    if (!f || f.status!=='active') return { ok:false, reason:'Metrc facility not active for '+a.license };
    return { ok:true, reason:'' };
  },
  reserveLot: function(uid, qty){
    var lot = this.lotByUid(uid); if (!lot) return { ok:false, reason:'Lot not found' };
    if (!this.isPassing(lot)) return { ok:false, reason:'Metrc status '+this.status(lot) };
    if (qty > this.availLot(lot)) return { ok:false, reason:'Exceeds available ('+this.availLot(lot)+')' };
    lot.reserved += qty; return { ok:true, reason:'' };
  },

  // ---- order state machine ----
  nextStage: function(stage){ var i = STAGES.indexOf(stage); return i>=0 && i<STAGES.length-1 ? STAGES[i+1] : null; },
  advanceOrder: function(id){
    var o = this.order(id); if (!o) return { ok:false, msg:'Order not found' };
    var to = this.nextStage(o.stage); if (!to) return { ok:false, msg:'Already settled' };
    var self = this;
    if (to==='confirmed'){
      var gate = this.accountGate(o.accountId); if (!gate.ok) return { ok:false, msg:'Gate refused: '+gate.reason };
      var alloc = this.allocate(o);
      if (!alloc.ok){ this.releaseAllocations(o); return { ok:false, msg:'Test gate or stock: no passable lots for '+alloc.short.join(', ') }; }
    }
    if (to==='shipped'){
      if (!o.manifest) return { ok:false, msg:'Record a Metrc transfer manifest before shipping' };
      o.lines.forEach(function(l){ l.allocations.forEach(function(a){ var lot=self.lotByUid(a.uid); if (lot){ lot.qty-=a.qty; lot.reserved-=a.qty; var p=Trace.getPackage(a.uid); if (p) p.metrcQty=Math.max(0,p.metrcQty-a.qty); } }); });
      this.lots = this.lots.filter(function(l){ return l.qty>0; });
      o.shippedAt = TODAY; var acc = this.account(o.accountId); if (acc) acc.balance += o.total;
    }
    if (to==='paid'){ var acc2 = this.account(o.accountId); if (acc2) acc2.balance = Math.max(0, acc2.balance - o.total); }
    o.stage = to;
    return { ok:true, msg:'Advanced to ' + STAGE_LABEL[to] };
  },
  cancelOrder: function(id){ var o = this.order(id); if (!o) return false; if (['shipped','delivered','paid'].indexOf(o.stage)!==-1) return false; this.releaseAllocations(o); o.stage='cancelled'; return true; },
  drawManifest: function(id){ var o = this.order(id); if (!o) return null; var a = this.account(o.accountId); var res = Trace.createTransferDraft(o, a.license); o.manifest = res.manifest; return res.manifest; },

  // ---- creation ----
  createOrder: function(accountId, lines, promised){
    var gate = this.accountGate(accountId); if (!gate.ok) return { ok:false, msg:'Blocked: '+gate.reason };
    var o = this.pushOrder(accountId, lines, promised, 'draft', '', ''); return { ok:true, order:o };
  },
  addAccount: function(name, city, license, terms, credit){
    var a = { id:'ac'+(++this._aid), name:name, city:city, license:license||'OCM-RETAIL-PENDING', licenseExpiry:'2027-12-31', terms:terms||'COD', credit:+credit||6000, balance:0, velocity:0, status:'prospect' };
    this.accounts.push(a);
    Trace.seedFacility({ license:a.license, name:name, city:city, status:'pending', licenseExpiry:a.licenseExpiry });
    return a;
  },
  addSku: function(name, tier, price, cogs){
    var id = 'sku'+(++this._sid); var item = 'Bond '+name+' 0.5g AIO';
    this.skus.push({ id:id, name:name, tier:tier||'Everyday', price:+price||24, cogs:+cogs||10, status:'active', metrcItem:item, tokens:['Solventless',tier||'Everyday'], triad:['New','Clean','Real'], lifecycle:'Trial' });
    Trace.items.push({ name:item, sku:id }); return id;
  },
  addRun: function(skuId, qty, ready){ var r = { id:'RUN-'+(++this._rid), skuId:skuId, qty:+qty, stage:'fresh frozen', ready:ready||'2026-08-20', started:TODAY, yield:'estimated' }; this.runs.push(r); return r; },
  advanceRun: function(id){ var r = this.runs.filter(function(x){ return x.id===id; })[0]; if (!r) return false; var i = RUN_STAGES.indexOf(r.stage); if (i<RUN_STAGES.length-1){ r.stage = RUN_STAGES[i+1]; return true; } return false; },
  completeRun: function(id){
    var r = this.runs.filter(function(x){ return x.id===id; })[0]; if (!r || r.stage!=='ready') return null;
    var uid = this.seedLot(r.skuId, r.qty, 'TestingRequired', TODAY, 'Vault A', r.qty);
    this.runs = this.runs.filter(function(x){ return x.id!==id; });
    this.emit('FEED', 'Run '+r.id+' packaged into '+uid+' . Metrc status TestingRequired');
    return uid;
  },

  // ---- discrepancy and findings ----
  discrepancies: function(){
    var self = this, out = [];
    this.lots.forEach(function(l){ var p = Trace.getPackage(l.uid); if (!p) return; var v = p.metrcQty===0 && l.qty===0 ? 0 : Math.abs(p.metrcQty - l.qty) / Math.max(1, p.metrcQty); out.push({ uid:l.uid, sku:self.sku(l.skuId).name, erp:l.qty, metrc:p.metrcQty, variance:v, beyond: v>DISCREPANCY_TOL }); });
    return out;
  },
  scanDiscrepancies: function(){
    var self = this;
    this.discrepancies().filter(function(d){ return d.beyond; }).forEach(function(d){
      if (self.findings.filter(function(f){ return f.uid===d.uid && f.state==='open'; }).length) return;
      self.openInvestigation(d.uid);
    });
  },
  openInvestigation: function(uid){
    var d = this.discrepancies().filter(function(x){ return x.uid===uid; })[0]; if (!d) return false;
    if (this.findings.filter(function(f){ return f.uid===uid && f.state==='open'; }).length) return false;
    this.findings.unshift({ id:'FND-'+(this.findings.length+1), owner:'Felix', kind:'Metrc discrepancy', uid:uid, text:d.sku+' '+d.uid+' ERP '+d.erp+' vs Metrc '+d.metrc+' ('+Math.round(d.variance*100)+' percent)', state:'open', time:clock() });
    this.emit('ALERT', 'P1: inventory discrepancy beyond tolerance on '+d.sku+' '+uid+', Felix investigation opened');
    return true;
  },
  resolveInvestigation: function(uid){
    var f = this.findings.filter(function(x){ return x.uid===uid && x.state==='open'; })[0]; if (!f) return false;
    var lot = this.lotByUid(uid); var p = Trace.getPackage(uid); if (lot && p) lot.qty = p.metrcQty; // reconcile ERP to Metrc paper
    f.state='resolved'; this.emit('FEED', 'Discrepancy on '+uid+' reconciled to Metrc, finding closed'); return true;
  },
  emit: function(type, text){ this.feed.unshift({ id:'ev'+(this.feed.length+1), time:clock(), type:type, text:text }); },

  // ---- reporting ----
  revenueMTD: function(){ return this.orders.filter(function(o){ return o.shippedAt && o.shippedAt.indexOf('2026-07')===0; }).reduce(function(a,o){ return a+o.total; },0); },
  shipmentsThisWeek: function(){ return this.orders.filter(function(o){ return o.shippedAt && (dlt('2026-07-19', o.shippedAt) || o.shippedAt==='2026-07-19'); }); },
  revenueBySku: function(){ var out={}, self=this; this.skus.forEach(function(s){ out[s.id]=0; }); this.orders.forEach(function(o){ if (o.shippedAt) o.lines.forEach(function(l){ var s=self.sku(l.skuId); if (s) out[l.skuId]=(out[l.skuId]||0)+s.price*l.qty; }); }); return out; },
  revenueByAccount: function(){ var out={}, self=this; this.orders.forEach(function(o){ if (o.shippedAt) out[o.accountId]=(out[o.accountId]||0)+o.total; }); return out; },
  grossMargin: function(){ var self=this, rev=0, cost=0; this.orders.forEach(function(o){ if (o.shippedAt) o.lines.forEach(function(l){ var s=self.sku(l.skuId); if (s){ rev+=s.price*l.qty; cost+=s.cogs*l.qty; } }); }); return rev? (rev-cost)/rev : 0; },
  arOutstanding: function(){ return this.accounts.reduce(function(a,x){ return a+x.balance; },0); },
  reorderRate: function(){ return 0.41; },

  // ---- alerts ----
  alerts: function(){
    var self = this, out = [];
    this.orders.forEach(function(o){ if (self.isLate(o)){ var a=self.account(o.accountId); out.push({ level:'high', kind:'Late order', text:o.id+' for '+a.name+', '+a.city+' promised '+o.promised, view:'orders' }); } });
    this.skus.forEach(function(s){ if (s.status==='active' && self.available(s.id) < LOW_STOCK){ out.push({ level:'high', kind:'Low stock', text:s.name+' available '+self.available(s.id)+' below velocity cover', view:'stock' }); } });
    this.lots.forEach(function(l){ if (dlt(l.packageDate, '2026-05-01')){ out.push({ level:'medium', kind:'Aging lot', text:l.uid+' packaged '+l.packageDate, view:'stock' }); } });
    this.runs.forEach(function(r){ if (dlt(r.ready, TODAY) && r.stage!=='ready'){ out.push({ level:'medium', kind:'Late run', text:r.id+' ('+self.sku(r.skuId).name+') due '+r.ready+', still '+r.stage, view:'production' }); } });
    this.accounts.forEach(function(a){ var d=daysUntil(a.licenseExpiry); if (d>=0 && d<=60){ out.push({ level:'high', kind:'License expiry', text:a.name+', '+a.city+' license expires in '+d+' days', view:'accounts' }); } });
    this.accounts.forEach(function(a){ if (a.balance > a.credit){ out.push({ level:'high', kind:'Receivable', text:a.name+' balance '+money(a.balance)+' over '+money(a.credit), view:'accounts' }); } });
    var tags = Trace.getTagInventory(); if (tags.packageRemaining < tags.packageThreshold){ out.push({ level:'high', kind:'Low Metrc tags', text:'Package UIDs '+tags.packageRemaining+' below threshold '+tags.packageThreshold, view:'trace' }); }
    this.findings.filter(function(f){ return f.state==='open'; }).forEach(function(f){ out.push({ level:'high', kind:'Discrepancy', text:f.text, view:'trace' }); });
    return out;
  },

  kpis: function(){
    var self = this;
    return {
      openOrders: this.openOrders().length,
      inFulfillment: this.orders.filter(function(o){ return o.stage==='fulfillment'; }).length,
      late: this.orders.filter(function(o){ return self.isLate(o); }).length,
      onHand: this.skus.reduce(function(a,s){ return a+self.onHand(s.id); },0),
      lots: this.lots.length,
      inProcess: this.unitsInProcess(),
      runs: this.runs.length,
      shipWeek: this.shipmentsThisWeek().length,
      shipUnits: this.shipmentsThisWeek().reduce(function(a,o){ return a+self.orderUnits(o); },0),
      revMTD: this.revenueMTD(),
      reorder: this.reorderRate()
    };
  }
};

function orderDetail(o){
  var a = ProductStore.account(o.accountId); var next = ProductStore.nextStage(o.stage);
  var steps = '<div class="step" style="margin-top:8px">'+STAGES.map(function(st,i){ var idx=STAGES.indexOf(o.stage); var cls=i<idx?'done':i===idx?'now':''; return '<div class="stepdot '+cls+'"></div>'+(i<STAGES.length-1?'<div class="stepbar '+(i<idx?'done':'')+'"></div>':''); }).join('')+'</div>'

function renderTrace(){
  var s = Trace.getSyncStatus(); var tags = Trace.getTagInventory();
  var head = headerBar('Trace', 'The Metrc room. Sync, tags, discrepancies, and the raw package mirror.', '<button id="traceRefresh" class="act go">Refresh Metrc</button>'+pv());
  var sync = '<div class="card"><div style="display:flex;justify-content:space-between"><span class="lbl">Sync status</span>'+metrcStamp()+'</div>'
    + '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px;font-size:12.5px">'
    + syncCell('Packages', s.packages, s.stale) + syncCell('Transfers', s.transfers, s.stale) + syncCell('Lab results', s.labResults, true) + syncCell('Tag inventory', s.tags, s.stale) + '</div>'
    + '<div style="font-size:12px;color:#6E685E;margin-top:12px">Next scheduled pull '+esc(s.next)+' . cadence 15 minutes . writes are explicit and confirmed</div></div>';
  var tagLow = tags.packageRemaining < tags.packageThreshold;
  var tagCard = '<div class="card"><div class="lbl">Tag inventory</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">'
    + '<div><div style="display:flex;justify-content:space-between;font-size:13px"><span>Package UIDs</span><span class="mono" style="color:'+(tagLow?'#D4664C':'#8E887C')+'">'+tags.packageRemaining+'</span></div><div class="bar" style="margin-top:6px"><span style="width:'+Math.min(100,Math.round(tags.packageRemaining/1000*100))+'%;background:'+(tagLow?'#8A4A32':'#4E8A2B')+'"></span></div><div style="font-size:11px;color:#5E5A52;margin-top:4px">threshold '+tags.packageThreshold+' . '+money(tags.unitCost)+' each</div></div>'
    + '<div><div style="display:flex;justify-content:space-between;font-size:13px"><span>Retail QR identifiers</span><span class="mono" style="color:#8E887C">'+tags.retailRemaining.toLocaleString()+'</span></div><div class="bar" style="margin-top:6px"><span style="width:'+Math.min(100,Math.round(tags.retailRemaining/10000*100))+'%"></span></div><div style="font-size:11px;color:#5E5A52;margin-top:4px">threshold '+tags.retailThreshold.toLocaleString()+'</div></div>'
    + '</div>'+(tagLow?'<div style="font-size:12px;color:#C08457;margin-top:12px">Low tag inventory. Running out of tags stops production.</div>':'')+'</div>';
  var disc = ProductStore.discrepancies();
  var consoleTable = '<div class="card" style="padding:0;margin-top:16px"><div style="padding:15px 16px;border-bottom:1px solid #202220;color:#E1DAD0;font-size:12.5px">Discrepancy console . ERP versus Metrc</div><table class="data"><thead><tr><th>Metrc UID</th><th>SKU</th><th>ERP qty</th><th>Metrc qty</th><th>Variance</th><th>State</th><th></th></tr></thead><tbody>'
    + disc.map(function(d){ var f=ProductStore.findings.filter(function(x){ return x.uid===d.uid; })[0]; var st=f?f.state:'clear'; var vc=d.beyond?'#D4664C':'#8E887C';
      return '<tr'+(d.beyond?' style="background:#1E1614"':'')+'><td class="mono">'+esc(d.uid.slice(-10))+'</td><td style="color:#E1DAD0">'+esc(d.sku)+'</td><td class="mono">'+d.erp+'</td><td class="mono">'+d.metrc+'</td><td class="mono" style="color:'+vc+'">'+Math.round(d.variance*100)+' percent</td><td>'+(d.beyond?(st==='open'?'<span class="badge" style="border-color:#4A3A2A;color:#D4664C">Investigation open</span>':st==='resolved'?'<span class="badge" style="border-color:#2E4A22;color:#7CBF4E">Resolved</span>':'<span class="badge" style="border-color:#4A3A2A;color:#C08457">Beyond tolerance</span>'):'<span class="badge">Within 2 percent</span>')+'</td>'
      + '<td>'+(d.beyond && st!=='resolved'? (st==='open'? '<button class="act go" data-resolve="'+d.uid+'">Resolve</button>' : '<button class="act no" data-investigate="'+d.uid+'">Open investigation</button>') : '')+'</td></tr>'; }).join('') + '</tbody></table></div>';
  var pkgs = Trace.getPackages();
  var mirror = '<div class="split" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px"><div class="card" style="padding:0"><div style="padding:15px 16px;border-bottom:1px solid #202220;color:#E1DAD0;font-size:12.5px">Metrc packages (read only)</div><table class="data"><thead><tr><th>UID</th><th>Item</th><th>Qty</th><th>Status</th></tr></thead><tbody>'
    + pkgs.map(function(p){ return '<tr><td class="mono">'+esc(p.uid.slice(-10))+'</td><td>'+esc(p.item)+'</td><td class="mono">'+p.metrcQty+'</td><td>'+testBadge(p.testStatus)+'</td></tr>'; }).join('')+'</tbody></table></div>'
    + '<div class="card" style="padding:0"><div style="padding:15px 16px;border-bottom:1px solid #202220;color:#E1DAD0;font-size:12.5px">Metrc transfers (read only)</div><table class="data"><thead><tr><th>Manifest</th><th>Destination</th><th>Packages</th><th>Status</th></tr></thead><tbody>'
    + Trace.getTransfers().map(function(t){ return '<tr><td class="mono">'+esc(t.manifest)+'</td><td class="mono">'+esc(t.destination)+'</td><td class="mono">'+t.packages+'</td><td>'+esc(t.status)+'</td></tr>'; }).join('')+'</tbody></table></div></div>';
  main.innerHTML = head + scroller(sync + '<div style="height:16px"></div>' + tagCard + consoleTable + mirror) + previewFooter('Design preview . mock data . a seeded discrepancy and a seeded stale sync make both failure states visible');
}
function syncCell(name, time, stale){ return '<div><div class="lbl">'+esc(name)+'</div><div class="mono" style="color:'+(stale?'#C08457':'#B0A99A')+';margin-top:4px">'+esc(time)+(stale?' . stale':'')+'</div></div>'; }

// ================= router =================
function route(){
  var h = location.hash || '#/product/dashboard';
  var parts = h.replace(/^#\//,'').split('/');
  var wing = parts[0] || 'product'; var view = parts[1] || 'dashboard';
  if (wing !== 'product'){ var map = { vauxhall:'Vauxhall.dc.html', security:'Security.dc.html', social:'Social.dc.html' }; if (map[wing]){ window.location.href = map[wing]; return; } view = 'dashboard'; }
  setRailActive(view);
  switch(view){
    case 'orders': renderOrders(); break;
    case 'stock': renderStock(); break;
    case 'production': renderProduction(); break;
    case 'accounts': renderAccounts(); break;
    case 'sales': renderSales(); break;
    case 'skus': renderSkus(); break;
    case 'alerts': renderAlerts(); break;
    case 'trace': renderTrace(); break;
    default: renderDashboard();
  }
}
function go(view){ location.hash = '#/product/'+view; }

// ================= events =================
document.addEventListener('click', function(ev){
  var t = ev.target;

  var or = t.closest('.ordRow'); if (or){ ordSel = or.getAttribute('data-oid'); if ((location.hash||'').indexOf('/orders')===-1) go('orders'); else renderOrders(); return; }
  var os = t.closest('[data-ostage]'); if (os){ ordFilter = os.getAttribute('data-ostage')||null; renderOrders(); return; }
  var adv = t.closest('[data-adv]'); if (adv){ var res = ProductStore.advanceOrder(adv.getAttribute('data-adv')); toast(res.msg); if (res.ok) renderOrders(); return; }
  var can = t.closest('[data-cancel]'); if (can){ if (ProductStore.cancelOrder(can.getAttribute('data-cancel'))){ toast('Order cancelled. Reservations released.'); renderOrders(); } else toast('Cannot cancel a shipped order.'); return; }
  var mf = t.closest('[data-manifest]'); if (mf){ var m = ProductStore.drawManifest(mf.getAttribute('data-manifest')); toast('Metrc transfer draft '+m+' created.'); renderOrders(); return; }
  if (t.id==='noAddLine'){ addOrderLine(); return; }
  if (t.id==='noCreate'){ createNewOrder(); return; }

  var rl = t.closest('[data-reslot]'); if (rl){ var r = ProductStore.reserveLot(rl.getAttribute('data-reslot'), 50); toast(r.ok? 'Allocated 50 units.' : 'Blocked: '+r.reason); if (r.ok) renderStock(); return; }
  if (t.id==='stockRefresh' || t.id==='traceRefresh'){ Trace.refresh(); toast('Metrc pulled. Sync green.'); route(); return; }

  var arun = t.closest('[data-advrun]'); if (arun){ ProductStore.advanceRun(arun.getAttribute('data-advrun')); toast('Run advanced.'); renderProduction(); return; }
  var comp = t.closest('[data-complete]'); if (comp){ var uid = ProductStore.completeRun(comp.getAttribute('data-complete')); if (uid){ toast('Package '+uid.slice(-8)+' minted, TestingRequired. Lab result pending.'); renderProduction(); scheduleLabFlip(uid); } return; }
  if (t.id==='nrAdd'){ var nq=+valOf('nrQty'); if (!nq){ toast('Enter a quantity.'); return; } ProductStore.addRun(valOf('nrSku'), nq, valOf('nrReady')); toast('Run started.'); renderProduction(); return; }

  var acr = t.closest('.acctRow'); if (acr){ acctSel = acr.getAttribute('data-aid'); renderAccounts(); return; }
  if (t.id==='naAdd'){ var nm=valOf('naName'), lic=valOf('naLicense'); if (!nm){ toast('Name the account.'); return; } if (!lic){ toast('A license number is required.'); return; } var a=ProductStore.addAccount(nm, valOf('naCity'), lic, valOf('naTerms'), valOf('naCredit')); acctSel=a.id; toast('Added. Metrc facility status: pending verification.'); renderAccounts(); return; }

  if (t.id==='boardToggle'){ boardView = !boardView; renderSales(); return; }
  var stb = t.closest('[data-salestab]'); if (stb){ salesTab = stb.getAttribute('data-salestab'); renderSales(); return; }

  var stog = t.closest('[data-skutoggle]'); if (stog){ var sk=ProductStore.sku(stog.getAttribute('data-skutoggle')); sk.status = sk.status==='active'?'paused':'active'; sk.lifecycle = sk.status==='active'?(sk.tier==='Reserve'?'Reserve':'Active'):'Retired'; toast(sk.name+' '+(sk.status==='active'?'activated':'paused')+'.'); renderSkus(); return; }
  if (t.id==='nsAdd'){ var nn=valOf('nsName'); if (!nn){ toast('Name the SKU.'); return; } ProductStore.addSku(nn, valOf('nsTier'), valOf('nsPrice'), valOf('nsCogs')); toast('SKU added, Metrc item registered, propagated.'); renderSkus(); return; }

  var inv = t.closest('[data-investigate]'); if (inv){ ProductStore.openInvestigation(inv.getAttribute('data-investigate')); toast('Investigation opened. Felix finding filed, Live Feed alerted.'); renderTrace(); return; }
  var rsv = t.closest('[data-resolve]'); if (rsv){ ProductStore.resolveInvestigation(rsv.getAttribute('data-resolve')); toast('Reconciled to Metrc. Finding closed.'); renderTrace(); return; }
});

document.addEventListener('input', function(ev){ if (ev.target.id==='noPromised'){ newOrder.promised = ev.target.value; } });
document.addEventListener('change', function(ev){
  var t = ev.target;
  if (t.id==='noAcct'){ newOrder.accountId = t.value; return; }
  if (t.classList && t.classList.contains('ueEdit')){ var s=ProductStore.sku(t.getAttribute('data-uesku')); var f=t.getAttribute('data-uefield'); var v=parseFloat(t.value); if (!isNaN(v)){ s[f]=v; renderSales(); toast('Recomputed.'); } return; }
});

function valOf(id){ var el = document.getElementById(id); return el? el.value : ''; }
function addOrderLine(){ var sk=valOf('noSku'), q=+valOf('noQty'); if (!q){ toast('Enter a quantity.'); return; } newOrder.lines.push({ skuId:sk, qty:q }); renderOrders(); }
function createNewOrder(){
  if (!newOrder.accountId){ toast('Choose an account.'); return; }
  if (!newOrder.lines.length){ toast('Add at least one line.'); return; }
  var res = ProductStore.createOrder(newOrder.accountId, newOrder.lines.slice(), newOrder.promised);
  if (!res.ok){ toast(res.msg); return; }
  ordSel = res.order.id; newOrder = { accountId:'', lines:[], promised:'2026-08-15' }; toast('Order '+res.order.id+' created as a draft.'); renderOrders();
}
// simulated lab result event: TestingRequired flips to TestPassed after a delay
function scheduleLabFlip(uid){ setTimeout(function(){ if (Trace.flipLabResult(uid)){ ProductStore.emit('FEED', 'Lab result received for '+uid.slice(-8)+', Metrc status TestPassed'); toast('Lab result in: '+uid.slice(-8)+' is now TestPassed.'); var v=(location.hash||''); if (v.indexOf('/stock')!==-1||v.indexOf('/production')!==-1||v.indexOf('/trace')!==-1) route(); } }, 6000); }

window.addEventListener('hashchange', route);
ProductStore.seed();
if (!location.hash) location.hash = '#/product/dashboard';
route();
</script>
